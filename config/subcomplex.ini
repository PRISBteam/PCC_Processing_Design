; Subcomplex module specifications

[subcomplex_type]
subPCC_type = H
;| Calculation type:
; 'P'  --> is for 'plane cut',
; 'H'  --> is for 'half-plane cut' of a 'half_plane_length' equal to 'a',
; 'N'  --> is for k-order (k_max)-cells (grain) neighbours.

[plane_section]
a_coeff = 0
b_coeff = 0
c_coeff = 1
D_coeff = 0.01
;| plane parameters (plane normal [a,b,c] + D)

[half_plane_section]
half_plane_length = 0.4
;| if 'H' type:  half_plane_length = r/L, where r is the 'crack' size and L is the length of the whole plane cut

[k_order_neighbours]
neighbours_order = 5
;| if 'N' type: for each grain create a subcomplex containing all its grain neighborous up to the neighbour order equal to the value MAX 'neighbours-order' parameter.

[module_output]
module_log_file = ON
; 'ON' or 'OFF' writing of technical information to the corresponding '*.log' file of the module
